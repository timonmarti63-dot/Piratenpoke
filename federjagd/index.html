<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d2a3a">
<title>Federjagd</title>
<style>
  :root { color-scheme: dark; --bg:#141b26; --ink:#fff7e0; --gold:#ffcf3a; --red:#e8452e; }
  * { box-sizing:border-box; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden; overscroll-behavior:none; touch-action:none;
    font-family:"Trebuchet MS",system-ui,sans-serif; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #box { position:relative; width:min(100vw, calc(100dvh * 16 / 9)); aspect-ratio:16/9; }
  canvas { width:100%; height:100%; display:block; cursor:none; touch-action:none; }
  .ov { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; background:rgba(10,14,22,.72); }
  .ov.off { display:none; }
  h1 { margin:0; font-size:clamp(34px,8vw,72px); letter-spacing:.04em; color:var(--gold); text-shadow:0 4px 0 #7a3b00; transform:rotate(-2deg); }
  p { margin:0; font-size:clamp(13px,2.4vw,20px); max-width:32em; padding:0 16px; }
  button { font:inherit; font-weight:800; font-size:clamp(16px,3vw,26px); padding:.5em 1.4em; border:0; border-radius:12px; background:var(--gold); color:#3a1d00; box-shadow:0 5px 0 #a8741a; cursor:pointer; }
  button:active { transform:translateY(3px); box-shadow:0 2px 0 #a8741a; }
  #reload { position:absolute; right:10px; bottom:10px; font-size:clamp(12px,2.2vw,18px); padding:.5em 1em; background:#3b4d66; color:var(--ink); box-shadow:0 4px 0 #1f2b3c; }
  #rot { position:fixed; inset:0; z-index:9; background:var(--bg); display:none; align-items:center; justify-content:center; flex-direction:column; gap:10px; font-size:20px; font-weight:800; }
  @media (orientation:portrait) { #rot { display:flex; } }
</style>
</head>
<body>
<div id="rot"><div style="font-size:56px">📱↻</div>Bitte Handy quer halten</div>
<div id="stage"><div id="box">
  <canvas id="c" width="960" height="540"></canvas>
  <button id="reload">Nachladen (R)</button>
  <div class="ov" id="start">
    <h1>FEDERJAGD</h1>
    <p>90 Sekunden, 8 Schuss pro Magazin. Je kleiner und weiter weg das Huhn, desto mehr Punkte. Das goldene Huhn gibt 50, die Windmühle 10.</p>
    <p style="opacity:.8">Tippen oder Klicken = Schiessen. Magazin leer? Nachladen-Knopf, Taste R oder einfach nochmal tippen.</p>
    <button id="go">Los geht's</button>
    <p id="hi" style="opacity:.8"></p>
  </div>
  <div class="ov off" id="end">
    <h1 id="end-h">Zeit um!</h1>
    <p id="end-t"></p>
    <button id="again">Nochmal</button>
  </div>
</div></div>

<script>
"use strict";
const W = 960, H = 540, ROUND = 90, MAG = 8, RELOAD = 0.9;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);

// Ebenen: 0 = weit weg (klein, viele Punkte) … 2 = nah (gross, wenige Punkte)
const LAYERS = [
  { scale: 0.45, pts: 25, speed: [90, 140],  y: [70, 230] },
  { scale: 0.8,  pts: 15, speed: [130, 200], y: [90, 300] },
  { scale: 1.35, pts: 5,  speed: [190, 280], y: [110, 360] },
];

let best = 0;
try { best = +localStorage.getItem("federjagd.best") || 0; } catch (e) {}
$("hi").textContent = best ? `Rekord: ${best} Punkte` : "";

let state = "menu", score, timeLeft, ammo, reloadT, chickens, feathers, pops, spawnT, mouse = { x: W / 2, y: H / 2 }, flash = 0, shake = 0, t = 0;
let mill = { spin: 0.6, boost: 0 }, combo = 0, hits = 0, shots = 0;

function start() {
  state = "play"; score = 0; timeLeft = ROUND; ammo = MAG; reloadT = 0; chickens = []; feathers = []; pops = []; spawnT = 0; combo = 0; hits = 0; shots = 0;
  $("start").classList.add("off"); $("end").classList.add("off");
}
function finish() {
  state = "over";
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem("federjagd.best", best); } catch (e) {} }
  $("end-h").textContent = isBest ? "Neuer Rekord!" : "Zeit um!";
  const acc = shots ? Math.round(hits / shots * 100) : 0;
  $("end-t").textContent = `${score} Punkte · ${hits} Treffer · ${acc} % Trefferquote · Rekord ${best}`;
  $("end").classList.remove("off");
}

// ---------- Audio (nach erster Interaktion) ----------
let ac;
function sfx(kind) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
    o.connect(g); g.connect(ac.destination);
    if (kind === "shot") { o.type = "sawtooth"; o.frequency.setValueAtTime(220, n); o.frequency.exponentialRampToValueAtTime(40, n + .15); g.gain.setValueAtTime(.25, n); g.gain.exponentialRampToValueAtTime(.001, n + .18); }
    else if (kind === "hit") { o.type = "square"; o.frequency.setValueAtTime(700, n); o.frequency.exponentialRampToValueAtTime(200, n + .2); g.gain.setValueAtTime(.12, n); g.gain.exponentialRampToValueAtTime(.001, n + .22); }
    else if (kind === "click") { o.type = "square"; o.frequency.value = 120; g.gain.setValueAtTime(.1, n); g.gain.exponentialRampToValueAtTime(.001, n + .06); }
    else { o.type = "triangle"; o.frequency.setValueAtTime(300, n); o.frequency.linearRampToValueAtTime(500, n + .25); g.gain.setValueAtTime(.12, n); g.gain.exponentialRampToValueAtTime(.001, n + .3); }
    o.start(n); o.stop(n + .3);
  } catch (e) {}
}

// ---------- Hühner ----------
function spawn() {
  const gold = Math.random() < 0.05;
  const li = gold ? 0 : (Math.random() * 3) | 0, L = LAYERS[li];
  const dir = Math.random() < .5 ? 1 : -1;
  chickens.push({
    li, gold, x: dir > 0 ? -80 : W + 80, y: rnd(L.y[0], L.y[1]),
    vx: dir * rnd(L.speed[0], L.speed[1]) * (gold ? 1.6 : 1), dir, ph: Math.random() * 7, bob: rnd(.5, 1.2),
    dead: false, vy: 0, rot: 0, s: L.scale * (gold ? 1.1 : 1), pts: gold ? 50 : L.pts, flap: rnd(8, 12),
  });
}

function shoot(x, y) {
  if (ammo <= 0) { if (reloadT <= 0) reload(); return; }
  if (reloadT > 0) return;
  ammo--; shots++; flash = .08; shake = 4; sfx("shot");
  // Trefferprüfung von vorne (nah) nach hinten (weit)
  const order = chickens.filter(c => !c.dead).sort((a, b) => b.li - a.li || b.s - a.s);
  for (const c of order) {
    const dx = x - c.x, dy = y - (c.y + Math.sin(c.ph) * 6 * c.s);
    if (dx * dx / (34 * c.s) ** 2 + dy * dy / (26 * c.s) ** 2 < 1.15) {
      c.dead = true; c.vy = -120; c.vx *= .3; hits++; combo++;
      const bonus = combo >= 3 ? Math.min(combo - 2, 5) : 0;
      const p = c.pts + bonus; score += p;
      pops.push({ x: c.x, y: c.y - 30 * c.s, txt: "+" + p, life: 1, col: c.gold ? "#ffcf3a" : "#fff" });
      for (let i = 0; i < 12; i++) feathers.push({ x: c.x, y: c.y, vx: rnd(-160, 160), vy: rnd(-200, 40), r: rnd(0, 6), life: rnd(.7, 1.4), col: c.gold ? "#ffd84a" : (Math.random() < .5 ? "#c4733a" : "#f2e3c0") });
      sfx("hit"); return;
    }
  }
  // Windmühle
  if (Math.hypot(x - 760, y - 285) < 70) { mill.boost = 1.6; score += 10; pops.push({ x, y: y - 20, txt: "+10", life: 1, col: "#fff" }); sfx("hit"); return; }
  combo = 0;
}
function reload() { if (reloadT > 0 || ammo === MAG) return; reloadT = RELOAD; sfx("click"); }

// ---------- Update ----------
function update(dt) {
  t += dt;
  mill.boost = Math.max(0, mill.boost - dt);
  mill.spin += dt * (0.6 + mill.boost * 6);
  flash = Math.max(0, flash - dt); shake = Math.max(0, shake - 20 * dt);
  for (const f of feathers) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 180 * dt; f.vx *= .98; f.r += dt * 6; f.life -= dt; }
  feathers = feathers.filter(f => f.life > 0);
  for (const p of pops) { p.y -= 40 * dt; p.life -= dt; }
  pops = pops.filter(p => p.life > 0);
  if (state !== "play") { for (const c of chickens) stepChicken(c, dt); chickens = chickens.filter(c => c.x > -150 && c.x < W + 150 && c.y < H + 100); return; }

  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; finish(); return; }
  if (reloadT > 0) { reloadT -= dt; if (reloadT <= 0) { ammo = MAG; sfx("ready"); } }
  spawnT -= dt;
  if (spawnT <= 0 && chickens.length < 14) { spawn(); spawnT = rnd(.35, 1.0); }
  for (const c of chickens) stepChicken(c, dt);
  chickens = chickens.filter(c => c.x > -150 && c.x < W + 150 && c.y < H + 100);
}
function stepChicken(c, dt) {
  if (c.dead) { c.vy += 900 * dt; c.y += c.vy * dt; c.x += c.vx * dt; c.rot += dt * 9 * c.dir; }
  else { c.x += c.vx * dt; c.ph += dt * c.flap * c.bob; }
}

// ---------- Zeichnen ----------
function drawChicken(c) {
  const s = c.s, flapA = c.dead ? 0.5 : Math.sin(c.ph * 1.0);
  ctx.save(); ctx.translate(c.x, c.y + (c.dead ? 0 : Math.sin(c.ph) * 6 * s)); ctx.scale(s * c.dir, s); ctx.rotate(c.rot * c.dir);
  const body = c.gold ? "#f6c91c" : "#6b3f23", belly = c.gold ? "#fff0a0" : "#a86a3a", wing = c.gold ? "#d9a300" : "#43260f";
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.55)";
  // Schwanz
  ctx.fillStyle = wing; ctx.beginPath(); ctx.moveTo(-26, -4); ctx.quadraticCurveTo(-52, -26, -48, 8); ctx.quadraticCurveTo(-40, 2, -26, 8); ctx.fill(); ctx.stroke();
  // Hinterer Flügel
  ctx.fillStyle = wing; ctx.beginPath(); ctx.ellipse(-4, -12 - flapA * 20, 24, 12, -0.5 - flapA * .5, 0, 7); ctx.fill(); ctx.stroke();
  // Körper
  ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, 4, 32, 21, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = belly; ctx.beginPath(); ctx.ellipse(6, 12, 20, 11, 0, 0, 7); ctx.fill();
  // Kopf
  ctx.fillStyle = body; ctx.beginPath(); ctx.arc(30, -14, 13, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#e8452e"; ctx.beginPath(); ctx.arc(27, -28, 5, 0, 7); ctx.arc(34, -27, 5, 0, 7); ctx.fill();
  ctx.fillStyle = "#ffb12b"; ctx.beginPath(); ctx.moveTo(41, -17); ctx.lineTo(54, -12); ctx.lineTo(41, -9); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#e8452e"; ctx.beginPath(); ctx.ellipse(42, -6, 3, 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(34, -17, 4.5, 0, 7); ctx.fill();
  ctx.fillStyle = c.dead ? "#c00" : "#111"; ctx.beginPath(); ctx.arc(35, -17, c.dead ? 2.5 : 2, 0, 7); ctx.fill();
  // Vorderer Flügel
  ctx.fillStyle = wing; ctx.beginPath(); ctx.ellipse(-2, 2 - flapA * 22, 26, 13, -0.3 + flapA * .7, 0, 7); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawScene() {
  // Himmel
  const g = ctx.createLinearGradient(0, 0, 0, 380); g.addColorStop(0, "#5aa9e6"); g.addColorStop(1, "#cfeefc");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // Wolken
  ctx.fillStyle = "rgba(255,255,255,.9)";
  for (let i = 0; i < 4; i++) { const x = ((i * 300 + t * (6 + i * 3)) % (W + 300)) - 150, y = 60 + i * 38; ctx.beginPath(); ctx.ellipse(x, y, 70, 20, 0, 0, 7); ctx.ellipse(x + 40, y - 10, 50, 22, 0, 0, 7); ctx.ellipse(x - 40, y - 4, 42, 16, 0, 0, 7); ctx.fill(); }
  // Berge
  ctx.fillStyle = "#8aa7c4"; ctx.beginPath(); ctx.moveTo(0, 330); for (let x = 0; x <= W; x += 40) ctx.lineTo(x, 250 - 60 * Math.abs(Math.sin(x * .006 + 1)) - 20 * Math.sin(x * .02)); ctx.lineTo(W, 330); ctx.fill();
  ctx.fillStyle = "#fff"; // Schneekappen
  ctx.globalAlpha = .6; for (const x of [200, 520, 880]) { ctx.beginPath(); ctx.moveTo(x - 36, 214); ctx.lineTo(x, 170); ctx.lineTo(x + 36, 214); ctx.fill(); } ctx.globalAlpha = 1;
  chickens.filter(c => c.li === 0).forEach(drawChicken);
  // Hügel hinten
  ctx.fillStyle = "#5c9a4a"; ctx.beginPath(); ctx.moveTo(0, H); for (let x = 0; x <= W; x += 30) ctx.lineTo(x, 350 - 30 * Math.sin(x * .008 + 2)); ctx.lineTo(W, H); ctx.fill();
  drawMill();
  chickens.filter(c => c.li === 1).forEach(drawChicken);
  // Vordere Wiese + Tannen
  ctx.fillStyle = "#3f7a34"; ctx.beginPath(); ctx.moveTo(0, H); for (let x = 0; x <= W; x += 30) ctx.lineTo(x, 430 - 22 * Math.sin(x * .011)); ctx.lineTo(W, H); ctx.fill();
  for (const x of [60, 150, 880, 930]) tree(x, 440, x % 3 ? 1.2 : 1.6);
  chickens.filter(c => c.li === 2).forEach(drawChicken);
  // Zaun ganz vorne
  ctx.fillStyle = "#6b4a2b"; for (let x = 20; x < W; x += 90) ctx.fillRect(x, 480, 10, 60); ctx.fillRect(0, 495, W, 8); ctx.fillRect(0, 520, W, 8);
}
function tree(x, y, s) {
  ctx.fillStyle = "#4a2f18"; ctx.fillRect(x - 6 * s, y - 20 * s, 12 * s, 40 * s);
  ctx.fillStyle = "#1f5a2c"; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(x - (46 - i * 9) * s, y - (i * 34 - 8) * s); ctx.lineTo(x, y - (i * 34 + 56) * s); ctx.lineTo(x + (46 - i * 9) * s, y - (i * 34 - 8) * s); ctx.fill(); }
}
function drawMill() {
  const x = 760, y = 285;
  ctx.fillStyle = "#e9dcc2"; ctx.beginPath(); ctx.moveTo(x - 26, y + 92); ctx.lineTo(x - 16, y); ctx.lineTo(x + 16, y); ctx.lineTo(x + 26, y + 92); ctx.fill();
  ctx.fillStyle = "#a33a2a"; ctx.beginPath(); ctx.moveTo(x - 22, y + 2); ctx.lineTo(x, y - 22); ctx.lineTo(x + 22, y + 2); ctx.fill();
  ctx.fillStyle = "#6b4a2b"; ctx.fillRect(x - 7, y + 62, 14, 30);
  ctx.save(); ctx.translate(x, y - 2); ctx.rotate(mill.spin);
  for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); ctx.fillStyle = "#6b4a2b"; ctx.fillRect(-3, 0, 6, 74); ctx.fillStyle = "#f5efe0"; ctx.fillRect(3, 8, 20, 60); ctx.strokeStyle = "#999"; ctx.lineWidth = 1; ctx.strokeRect(3, 8, 20, 60); }
  ctx.restore();
  ctx.fillStyle = "#333"; ctx.beginPath(); ctx.arc(x, y - 2, 6, 0, 7); ctx.fill();
}

function draw() {
  ctx.save();
  if (shake) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  drawScene();
  for (const f of feathers) { ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.r); ctx.globalAlpha = Math.min(1, f.life); ctx.fillStyle = f.col; ctx.beginPath(); ctx.ellipse(0, 0, 7, 3, 0, 0, 7); ctx.fill(); ctx.restore(); }
  ctx.globalAlpha = 1;
  ctx.font = "800 26px 'Trebuchet MS',system-ui,sans-serif"; ctx.textAlign = "center";
  for (const p of pops) { ctx.globalAlpha = Math.min(1, p.life * 1.5); ctx.lineWidth = 5; ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.strokeText(p.txt, p.x, p.y); ctx.fillStyle = p.col; ctx.fillText(p.txt, p.x, p.y); }
  ctx.globalAlpha = 1;
  if (flash > 0) { ctx.fillStyle = `rgba(255,240,180,${flash * 5})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
  hud();
  if (state === "play") crosshair();
}
function hud() {
  ctx.textBaseline = "top"; ctx.lineJoin = "round";
  const label = (txt, x, y, al, size = 30) => { ctx.font = `800 ${size}px 'Trebuchet MS',system-ui,sans-serif`; ctx.textAlign = al; ctx.lineWidth = 6; ctx.strokeStyle = "rgba(0,0,0,.65)"; ctx.strokeText(txt, x, y); ctx.fillStyle = "#fff7e0"; ctx.fillText(txt, x, y); };
  label(String(score || 0).padStart(4, "0"), 16, 10, "left", 38);
  const tl = Math.ceil(timeLeft ?? ROUND);
  ctx.fillStyle = tl <= 10 ? "#ff6a4d" : "#fff7e0";
  ctx.font = "800 38px 'Trebuchet MS',system-ui,sans-serif"; ctx.textAlign = "right"; ctx.lineWidth = 6; ctx.strokeStyle = "rgba(0,0,0,.65)"; ctx.strokeText(tl + " s", W - 16, 10); ctx.fillText(tl + " s", W - 16, 10);
  if (state === "play" && combo >= 3) label(`Serie x${combo}`, W / 2, 12, "center", 24);
  // Munition
  for (let i = 0; i < MAG; i++) { const full = i < (ammo ?? MAG); ctx.fillStyle = full ? "#ffcf3a" : "rgba(255,255,255,.2)"; ctx.fillRect(16 + i * 18, H - 44, 11, 28); ctx.fillStyle = full ? "#c9812a" : "rgba(255,255,255,.2)"; ctx.fillRect(16 + i * 18, H - 44, 11, 7); }
  if (reloadT > 0) { ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(16, H - 58, 140, 8); ctx.fillStyle = "#6fd36a"; ctx.fillRect(16, H - 58, 140 * (1 - reloadT / RELOAD), 8); }
  else if (ammo === 0 && state === "play") label("NACHLADEN!", W / 2, H - 70, "center", 30);
}
function crosshair() {
  const { x, y } = mouse; ctx.save(); ctx.translate(x, y);
  ctx.strokeStyle = "#ff3b2f"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 18, 0, 7); ctx.moveTo(-28, 0); ctx.lineTo(-8, 0); ctx.moveTo(8, 0); ctx.lineTo(28, 0); ctx.moveTo(0, -28); ctx.lineTo(0, -8); ctx.moveTo(0, 8); ctx.lineTo(0, 28); ctx.stroke();
  ctx.fillStyle = "#ff3b2f"; ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, 7); ctx.fill(); ctx.restore();
}

// ---------- Eingabe ----------
function pos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener("pointermove", e => { mouse = pos(e); });
cv.addEventListener("pointerdown", e => { e.preventDefault(); mouse = pos(e); if (state === "play") shoot(mouse.x, mouse.y); });
addEventListener("keydown", e => { if (e.code === "KeyR") reload(); if (e.code === "Space" && state === "play") shoot(mouse.x, mouse.y); });
$("reload").addEventListener("pointerdown", e => { e.stopPropagation(); reload(); });
$("go").onclick = start; $("again").onclick = start;
document.addEventListener("contextmenu", e => { e.preventDefault(); if (state === "play") reload(); });

// Demo-Hühner im Menü
state = "menu"; chickens = []; feathers = []; pops = []; score = 0; ammo = MAG; reloadT = 0; timeLeft = ROUND;
for (let i = 0; i < 6; i++) { spawn(); chickens[i].x = rnd(0, W); }
let last = performance.now(), menuT = 0;
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  if (state !== "play") { menuT -= dt; if (menuT <= 0 && chickens.length < 8) { spawn(); menuT = .8; } }
  update(dt); draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
