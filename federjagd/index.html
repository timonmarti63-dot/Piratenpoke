<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d2a3a">
<title>Federjagd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --bg:#0f1622; --ink:#fff7e0; --gold:#ffcf3a; --red:#e8452e; --font:'Lilita One','Trebuchet MS',system-ui,sans-serif; }
  * { box-sizing:border-box; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden; overscroll-behavior:none; touch-action:none; font-family:var(--font); }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 50% 40%,#22324a,#0a0f18); }
  #box { position:relative; width:min(100vw, calc(100dvh * 9 / 16)); aspect-ratio:9/16; box-shadow:0 0 60px rgba(0,0,0,.6); }
  canvas { width:100%; height:100%; display:block; cursor:none; touch-action:none; }
  .ov { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; background:radial-gradient(circle at 50% 45%,rgba(8,14,26,.55),rgba(8,14,26,.88)); backdrop-filter:blur(3px); }
  .ov.off { display:none; }
  h1 { margin:0; font-weight:400; font-size:clamp(46px,15vw,92px); line-height:.95; letter-spacing:.02em; transform:rotate(-4deg);
    background:linear-gradient(#fff3a8,#ffb81c 55%,#ff7a12); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 0 #7a2c00) drop-shadow(0 8px 14px rgba(0,0,0,.6)); animation:bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform:rotate(-4deg) translateY(-6px) scale(1.03); } }
  p { margin:0; font-family:system-ui,sans-serif; font-weight:600; font-size:clamp(13px,3.6vw,18px); max-width:22em; padding:0 18px; line-height:1.4; }
  .legend { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:min(94%,430px); }
  .leg { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:6px 4px 8px; font-size:clamp(12px,3.4vw,16px); line-height:1.15; }
  .leg canvas { width:72px; height:60px; display:block; margin:0 auto 2px; }
  .leg b { display:block; color:var(--gold); font-weight:400; } .leg.bad b { color:#ff7a6a; }
  .rules { display:grid; grid-template-columns:repeat(3,auto); gap:8px 18px; font-family:var(--font); font-size:clamp(14px,4vw,20px); }
  .rules b { color:var(--gold); font-weight:400; }
  button { font:inherit; font-size:clamp(20px,6vw,32px); padding:.45em 1.6em; border:0; border-radius:999px; cursor:pointer; color:#4a2100;
    background:linear-gradient(#ffe36b,#ffb11c); box-shadow:0 6px 0 #a8620a, 0 12px 22px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.7); }
  button:active { transform:translateY(4px); box-shadow:0 2px 0 #a8620a, inset 0 2px 0 rgba(255,255,255,.7); }
  #go { animation:pulse 1.4s ease-in-out infinite; } @keyframes pulse { 50% { transform:scale(1.06); } }
  #reload { position:absolute; right:3%; bottom:4.5%; font-size:clamp(13px,3.8vw,19px); padding:.5em 1.1em; color:#fff; background:linear-gradient(#5d7699,#3a4f6e); box-shadow:0 4px 0 #1c2a40, 0 8px 14px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.3); }
  #reload:active { box-shadow:0 1px 0 #1c2a40; }
  #rot { position:fixed; inset:0; z-index:9; background:var(--bg); display:none; align-items:center; justify-content:center; flex-direction:column; gap:10px; font-size:24px; }
  @media (orientation:landscape) and (pointer:coarse) and (max-height:600px) { #rot { display:flex; } }
</style>
</head>
<body>
<div id="rot"><div style="font-size:56px">📱</div>Bitte Handy hochkant halten</div>
<div id="stage"><div id="box">
  <canvas id="c" width="540" height="960"></canvas>
  <button id="reload">Nachladen (R)</button>
  <div class="ov" id="start">
    <h1>FEDER<br>JAGD</h1>
    <p>90 Sekunden, 6 Schuss. Je kleiner und weiter weg, desto mehr Punkte. Treffer in Folge geben Bonus.</p>
    <div class="legend" id="legend"></div>
    <p style="opacity:.8">Tippen = Schiessen. Leer? Nachladen-Knopf oder nochmal tippen.</p>
    <button id="go">Los geht's</button>
    <p id="hi" style="opacity:.8"></p>
  </div>
  <div class="ov off" id="end">
    <h1 id="end-h">Zeit um!</h1>
    <p id="end-t"></p>
    <button id="again">Nochmal</button>
  </div>
</div></div>

<script>
"use strict";
const W = 540, H = 960, ROUND = 90, MAG = 6, RELOAD = 1.0;
const DPR = Math.min(2, window.devicePixelRatio || 1);
const cv = document.getElementById("c"); let ctx = cv.getContext("2d");
cv.width = W * DPR; cv.height = H * DPR;
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const FONT = "'Lilita One','Trebuchet MS',system-ui,sans-serif";

// Ebenen: 0 = weit weg (klein, viele Punkte) … 2 = nah (gross, wenige Punkte)
const LAYERS = [
  { scale: 0.55, pts: 25, speed: [80, 130],  y: [110, 420] },
  { scale: 0.95, pts: 15, speed: [120, 190], y: [140, 560] },
  { scale: 1.5,  pts: 5,  speed: [180, 260], y: [170, 700] },
];
const MX = 400, MY = 565;

let best = 0;
try { best = +localStorage.getItem("federjagd.best") || 0; } catch (e) {}
$("hi").textContent = best ? `Rekord: ${best} Punkte` : "";

let state = "menu", score = 0, timeLeft = ROUND, ammo = MAG, reloadT = 0, chickens = [], feathers = [], pops = [], rings = [], sparks = [], spawnT = 0;
let mouse = { x: W / 2, y: H * .55 }, flash = 0, shake = 0, t = 0, kick = 0, hitStop = 0;
let mill = { spin: 0.6, boost: 0 }, combo = 0, hits = 0, shots = 0, banner = { txt: "", life: 0 }, swarmQ = 0, swarmT = 0, sw1 = false, sw2 = false;
const diff = () => state === "play" ? Math.min(1, (ROUND - timeLeft) / 70) : 0;
const prog = () => state === "menu" ? 0 : Math.min(1, (ROUND - timeLeft) / ROUND);

function start() {
  state = "play"; score = 0; timeLeft = ROUND; ammo = MAG; reloadT = 0; chickens = []; feathers = []; pops = []; rings = []; sparks = []; spawnT = 0; combo = 0; hits = 0; shots = 0; banner.life = 0; swarmQ = 0; sw1 = sw2 = false;
  $("start").classList.add("off"); $("end").classList.add("off");
}
function finish() {
  state = "over";
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem("federjagd.best", best); } catch (e) {} }
  $("end-h").textContent = isBest ? "Neuer Rekord!" : "Zeit um!";
  const acc = shots ? Math.round(hits / shots * 100) : 0;
  $("end-t").textContent = `${score} Punkte · ${hits} Treffer · ${acc} % Trefferquote · Rekord ${best}`;
  $("end").classList.remove("off");
}

// ---------- Audio ----------
let ac;
function sfx(kind) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
    o.connect(g); g.connect(ac.destination);
    if (kind === "shot") { o.type = "sawtooth"; o.frequency.setValueAtTime(220, n); o.frequency.exponentialRampToValueAtTime(40, n + .15); g.gain.setValueAtTime(.25, n); g.gain.exponentialRampToValueAtTime(.001, n + .18); }
    else if (kind === "hit") { o.type = "square"; o.frequency.setValueAtTime(700, n); o.frequency.exponentialRampToValueAtTime(200, n + .2); g.gain.setValueAtTime(.12, n); g.gain.exponentialRampToValueAtTime(.001, n + .22); }
    else if (kind === "gold") { o.type = "triangle"; o.frequency.setValueAtTime(600, n); o.frequency.linearRampToValueAtTime(1400, n + .3); g.gain.setValueAtTime(.16, n); g.gain.exponentialRampToValueAtTime(.001, n + .4); }
    else if (kind === "bad") { o.type = "sawtooth"; o.frequency.setValueAtTime(200, n); o.frequency.exponentialRampToValueAtTime(50, n + .35); g.gain.setValueAtTime(.2, n); g.gain.exponentialRampToValueAtTime(.001, n + .38); }
    else if (kind === "swarm") { o.type = "square"; o.frequency.setValueAtTime(260, n); o.frequency.setValueAtTime(390, n + .12); o.frequency.setValueAtTime(520, n + .24); g.gain.setValueAtTime(.12, n); g.gain.exponentialRampToValueAtTime(.001, n + .4); }
    else if (kind === "click") { o.type = "square"; o.frequency.value = 120; g.gain.setValueAtTime(.1, n); g.gain.exponentialRampToValueAtTime(.001, n + .06); }
    else { o.type = "triangle"; o.frequency.setValueAtTime(300, n); o.frequency.linearRampToValueAtTime(500, n + .25); g.gain.setValueAtTime(.12, n); g.gain.exponentialRampToValueAtTime(.001, n + .3); }
    o.start(n); o.stop(n + .4);
  } catch (e) {}
}

// ---------- Hühner ----------
const PAL = {
  hen:     { base: ["#b9763f", "#6b3f23", "#3a1f0e"], wing: ["#7a4a28", "#3a1f0e"], belly: "#d9a066", collar: "#e0952f", head: ["#d9863a", "#7a4420"], tails: ["#2f6b5a", "#8c4a22", "#43260f"], comb: "#e8302a", cs: 1 },
  gold:    { base: ["#fff0a0", "#f6c91c", "#b98900"], wing: ["#ffe066", "#d9a300"], belly: "#fff6c0", collar: "#ffe680", head: ["#fff6c0", "#e8b400"], tails: ["#d9a300", "#f0b800", "#ffd84a"], comb: "#ff9a1c", cs: 1, glow: "rgba(255,220,80,.95)" },
  rooster: { base: ["#f09a4a", "#b84a1e", "#5a1d0a"], wing: ["#c25a22", "#6a2410"], belly: "#f4b878", collar: "#ffcf3a", head: ["#f4a85a", "#a8401c"], tails: ["#1f8a6a", "#2a5fb0", "#7a2bb8"], comb: "#ff2a2a", cs: 1.55 },
  crow:    { base: ["#5a6580", "#232733", "#0e1018"], wing: ["#2f3446", "#0e1018"], belly: "#3a4260", collar: "#2f3446", head: ["#5a6580", "#161923"], tails: ["#1b1f2b", "#232733", "#0e1018"], comb: null, beak: ["#9aa0ae", "#6f7585"], eye: "#ff3b2f", cs: 0 },
  clock:   { base: ["#9fe6f4", "#2f9bb8", "#16607a"], wing: ["#4fb0cc", "#1c6b86"], belly: "#d8f6ff", collar: "#9be4f2", head: ["#b8f0fa", "#2f9bb8"], tails: ["#ffd84a", "#4fb0cc", "#1c6b86"], comb: "#ffb11c", cs: 1, clock: true, glow: "rgba(120,230,255,.7)" },
};
function pickSpecies() {
  const el = ROUND - timeLeft, r = Math.random();
  if (r < .04) return "gold";
  if (r < .075) return "clock";
  if (el > 4 && r < .19) return "crow";
  if (el > 10 && r < .32) return "chick";
  if (el > 18 && r < .42) return "rooster";
  return "hen";
}
function spawn(sp = pickSpecies()) {
  const d = diff(), mul = 1 + .5 * d, dir = Math.random() < .5 ? 1 : -1;
  let li = (Math.random() * 3) | 0, k = { pts: 0, hp: 1, hx: 36, hy: 28, sp: 1, sc: 1, amp: 0, fq: 0, dash: 0 };
  if (sp === "gold") { li = 0; k.sp = 1.7; k.pts = 50; k.sc = 1.15; k.amp = 45; k.fq = 3; }
  else if (sp === "clock") { li = 1; k.sp = 1.2; k.pts = 10; k.amp = 50; k.fq = 2.5; }
  else if (sp === "chick") { li = 1 + ((Math.random() * 2) | 0); k.sp = 1.5; k.pts = 40; k.hx = 24; k.hy = 24; k.sc = 1.15; k.amp = rnd(70, 110); k.fq = rnd(4, 6); }
  else if (sp === "rooster") { li = 1 + ((Math.random() * 2) | 0); k.sp = .7; k.pts = 40; k.hp = 2; k.sc = 1.3; k.hx = 42; k.hy = 32; k.dash = 1; }
  else if (sp === "crow") { k.sp = 1.35; k.sc = 1.05; k.hx = 34; k.hy = 24; if (Math.random() < .5) { k.amp = 30; k.fq = 2.5; } }
  else { k.pts = LAYERS[li].pts; if (Math.random() < .3 + d * .3) { k.amp = rnd(30, 70); k.fq = rnd(2, 3.4); } }
  const L = LAYERS[li], y0 = rnd(L.y[0], L.y[1]);
  chickens.push({
    sp, li, gold: sp === "gold", x: dir > 0 ? -100 : W + 100, y: y0, y0, vx: dir * rnd(L.speed[0], L.speed[1]) * k.sp * mul, dir, ph: Math.random() * 7, t2: Math.random() * 6, bob: rnd(.5, 1.2),
    dead: false, vy: 0, rot: 0, s: L.scale * k.sc, pts: k.pts, hp: k.hp, maxhp: k.hp, hx: k.hx, hy: k.hy, amp: k.amp, fq: k.fq, dash: k.dash, flash: 0, flap: rnd(8, 12) * (sp === "chick" ? 1.6 : 1),
  });
}

function shoot(x, y) {
  if (ammo <= 0) { if (reloadT <= 0) reload(); return; }
  if (reloadT > 0) return;
  ammo--; shots++; flash = .1; shake = 5; kick = 1; sfx("shot");
  const order = chickens.filter(c => !c.dead).sort((a, b) => b.li - a.li || b.s - a.s);
  for (const c of order) {
    const dx = x - c.x, dy = y - (c.y + Math.sin(c.ph) * 6 * c.s);
    if (dx * dx / (c.hx * c.s) ** 2 + dy * dy / (c.hy * c.s) ** 2 < 1.2) { hitChicken(c); return; }
  }
  if (Math.hypot(x - MX, y - (MY + 40)) < 80) { mill.boost = 1.6; score += 10; pops.push({ x, y: y - 20, txt: "+10", life: 1, col: "#fff" }); rings.push({ x, y, r: 6, life: .3, col: "255,255,255" }); sfx("hit"); return; }
  combo = 0;
}
function hitChicken(c) {
  const dark = c.sp === "crow";
  if (!dark) hits++;
  c.hp--;
  const burst = (n, cols) => { for (let i = 0; i < n; i++) feathers.push({ x: c.x, y: c.y, vx: rnd(-220, 220), vy: rnd(-260, 60), r: rnd(0, 6), life: rnd(.8, 1.6), col: cols[(Math.random() * cols.length) | 0], sz: rnd(.8, 1.4) * c.s + .3 }); };
  if (c.hp > 0) { c.flash = .25; burst(8, ["#f2e3c0", "#ff9a4a"]); rings.push({ x: c.x, y: c.y, r: 6, life: .25, col: "255,255,255" }); pops.push({ x: c.x, y: c.y - 40 * c.s, txt: "Au!", life: .7, col: "#ffd0a0" }); sfx("hit"); shake = 6; hitStop = .04; return; }
  c.dead = true; c.vy = -160; c.vx *= .3;
  if (dark) {
    score = Math.max(0, score - 20); combo = 0; shake = 14;
    pops.push({ x: c.x, y: c.y - 34 * c.s, txt: "-20", life: 1.1, col: "#ff6a5a", big: true });
    rings.push({ x: c.x, y: c.y, r: 6, life: .4, col: "255,90,70" }); burst(18, ["#2f3446", "#5a6580", "#161923"]); sfx("bad"); return;
  }
  combo++;
  const mult = 1 + Math.min(3, Math.floor(combo / 5)), p = c.pts * mult; score += p;
  pops.push({ x: c.x, y: c.y - 34 * c.s, txt: "+" + p + (mult > 1 ? " x" + mult : ""), life: 1, col: c.gold ? "#ffe066" : "#fff", big: c.gold || mult > 1 });
  if (c.sp === "clock") { timeLeft += 4; pops.push({ x: c.x, y: c.y - 74 * c.s, txt: "+4 s", life: 1.2, col: "#8fe9ff", big: true }); }
  rings.push({ x: c.x, y: c.y, r: 6, life: .35, col: c.gold ? "255,220,80" : "255,255,255" });
  burst(c.gold ? 26 : 16, c.gold ? ["#ffd84a", "#fff3b0"] : c.sp === "chick" ? ["#ffe14d", "#fff3b0"] : c.sp === "rooster" ? ["#e0803a", "#ffcf3a", "#2a5fb0"] : c.sp === "clock" ? ["#9be4f2", "#ffd84a"] : ["#c4733a", "#f2e3c0", "#6b3f23"]);
  hitStop = .06; shake = 9; sfx(c.gold || c.sp === "clock" ? "gold" : "hit");
}
function reload() { if (reloadT > 0 || ammo === MAG) return; reloadT = RELOAD; sfx("click"); }

// ---------- Update ----------
function update(dt) {
  if (hitStop > 0) { hitStop -= dt; dt *= .12; }
  t += dt;
  mill.boost = Math.max(0, mill.boost - dt);
  mill.spin += dt * (0.5 + mill.boost * 6);
  flash = Math.max(0, flash - dt); shake = Math.max(0, shake - 24 * dt); kick = Math.max(0, kick - dt * 5);
  for (const f of feathers) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 170 * dt; f.vx *= .985; f.vy *= .99; f.r += dt * 7; f.life -= dt; }
  feathers = feathers.filter(f => f.life > 0);
  banner.life -= dt; for (const c of chickens) c.flash = Math.max(0, c.flash - dt);
  for (const p of pops) { p.y -= 46 * dt; p.life -= dt; }
  pops = pops.filter(p => p.life > 0);
  for (const r of rings) { r.r += 260 * dt; r.life -= dt; }
  rings = rings.filter(r => r.life > 0);
  for (const sp of sparks) { sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.life -= dt; }
  sparks = sparks.filter(sp => sp.life > 0);
  for (const c of chickens) {
    if (c.gold && !c.dead && Math.random() < dt * 30) sparks.push({ x: c.x + rnd(-30, 30) * c.s, y: c.y + rnd(-20, 20) * c.s, vx: rnd(-20, 20), vy: rnd(10, 50), life: rnd(.4, .8) });
  }
  if (state !== "play") { for (const c of chickens) stepChicken(c, dt); chickens = chickens.filter(c => c.x > -160 && c.x < W + 160 && c.y < H + 100); return; }

  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; finish(); return; }
  if (reloadT > 0) { reloadT -= dt; if (reloadT <= 0) { ammo = MAG; sfx("ready"); } }
  if (!sw1 && timeLeft <= 60) { sw1 = true; swarmQ = 9; banner = { txt: "SCHWARM!", life: 1.8 }; sfx("swarm"); }
  if (!sw2 && timeLeft <= 30) { sw2 = true; swarmQ = 14; banner = { txt: "GROSSER SCHWARM!", life: 1.8 }; sfx("swarm"); }
  if (swarmQ > 0) { swarmT -= dt; if (swarmT <= 0) { spawn(Math.random() < .25 ? "chick" : "hen"); swarmQ--; swarmT = .17; } }
  spawnT -= dt; const d = diff();
  if (spawnT <= 0 && chickens.length < 16) { spawn(); spawnT = rnd(.3, 1.0) * (1.25 - .55 * d); }
  for (const c of chickens) stepChicken(c, dt);
  chickens = chickens.filter(c => c.x > -160 && c.x < W + 160 && c.y < H + 100);
}
function stepChicken(c, dt) {
  if (c.dead) { c.vy += 950 * dt; c.y += c.vy * dt; c.x += c.vx * dt; c.rot += dt * 9 * c.dir; return; }
  c.t2 += dt; c.ph += dt * c.flap * c.bob;
  const m = c.dash ? 1 + .9 * Math.max(0, Math.sin(c.t2 * 1.6)) : 1;
  c.x += c.vx * m * dt;
  if (c.amp) c.y = c.y0 + Math.sin(c.t2 * c.fq) * c.amp;
}

// ---------- Vorgerenderte Hintergrund-Ebenen ----------
function layer(fn) { const c = document.createElement("canvas"); c.width = W * DPR; c.height = H * DPR; const x = c.getContext("2d"); x.scale(DPR, DPR); fn(x); return c; }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let z = Math.imul(seed ^ seed >>> 15, 1 | seed); z = z + Math.imul(z ^ z >>> 7, 61 | z) ^ z; return ((z ^ z >>> 14) >>> 0) / 4294967296; }; }
function lin(x, y0, y1, stops) { const g = x.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }

function ridgePath(x, f, base) { x.beginPath(); x.moveTo(0, base); for (let i = 0; i <= W; i += 6) x.lineTo(i, f(i)); x.lineTo(W, base); x.closePath(); }
function pine(x, px, py, s, c1, c2) {
  x.fillStyle = "#3b2512"; x.fillRect(px - 3 * s, py - 6 * s, 6 * s, 14 * s);
  for (let i = 0; i < 3; i++) {
    const w = (34 - i * 7) * s, y0 = py - (i * 26 - 4) * s, g = x.createLinearGradient(px - w, 0, px + w, 0);
    g.addColorStop(0, c2); g.addColorStop(.5, c1); g.addColorStop(1, c2); x.fillStyle = g;
    x.beginPath(); x.moveTo(px - w, y0); x.lineTo(px, y0 - 46 * s); x.lineTo(px + w, y0); x.closePath(); x.fill();
  }
}

const BG = {};
function buildBackground() {
  // 1) Himmel, Sonne, Berge
  BG.sky = layer(x => {
    x.fillStyle = lin(x, 0, 720, [[0, "#2467c9"], [.4, "#5aaef0"], [.78, "#ffd9a6"], [1, "#ffeccd"]]); x.fillRect(0, 0, W, H);
  });
  BG.mtn = layer(x => {
    const mtn = (f, base, topCol, botCol, snowY, haze) => {
      ridgePath(x, f, base); x.fillStyle = lin(x, 300, base, [[0, topCol], [1, botCol]]); x.fill();
      // Schnee
      x.beginPath(); let started = false; const pts = [];
      for (let i = 0; i <= W; i += 3) { const r = f(i), d = Math.max(0, snowY - r) * .55; if (d > 0) pts.push([i, r, r + d + 7 * Math.abs(Math.sin(i * .35))]); }
      x.fillStyle = "rgba(255,255,255,.93)";
      let seg = [];

    ctx.fillStyle = full ? "#ffdb70" : "rgba(255,255,255,.15)"; ctx.fillRect(bx + 1.5, by + 14, 3, 24);
    ctx.fillStyle = full ? "#c9662a" : "rgba(255,255,255,.15)"; ctx.beginPath(); ctx.moveTo(bx, by + 14); ctx.lineTo(bx + 5.5, by + 1); ctx.lineTo(bx + 11, by + 14); ctx.fill();
  }
  if (reloadT > 0) { plate(12, H - 112, 184, 10, 5); ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fill(); plate(12, H - 112, Math.max(10, 184 * (1 - reloadT / RELOAD)), 10, 5); ctx.fillStyle = "#6fe07a"; ctx.fill(); }
  else if (ammo === 0 && state === "play") txt("NACHLADEN!", W / 2, H - 150, 34 + Math.sin(t * 10) * 2, "center", "#ffcf3a");
}
function crosshair() {
  const { x, y } = mouse, r = 20 + kick * 8; ctx.save(); ctx.translate(x, y); ctx.lineCap = "round";
  for (const [col, w] of [["rgba(0,0,0,.55)", 7], ["#ff3b2f", 3.5]]) {
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7);
    [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([a, b]) => { ctx.moveTo(a * (r - 6), b * (r - 6)); ctx.lineTo(a * (r + 12), b * (r + 12)); }); ctx.stroke();
  }
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, 3, 0, 7); ctx.fill(); ctx.restore();
}
function drawMill() {
  const x = MX, y = MY;
  ctx.save();
  let g = ctx.createLinearGradient(x - 28, 0, x + 28, 0); g.addColorStop(0, "#f4e8cf"); g.addColorStop(1, "#b9a77f");
  ctx.fillStyle = g; ctx.strokeStyle = "rgba(40,25,10,.6)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x - 28, y + 92); ctx.lineTo(x - 17, y); ctx.lineTo(x + 17, y); ctx.lineTo(x + 28, y + 92); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#b8402c"; ctx.beginPath(); ctx.moveTo(x - 24, y + 2); ctx.lineTo(x, y - 26); ctx.lineTo(x + 24, y + 2); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#6b4a2b"; ctx.fillRect(x - 7, y + 62, 14, 30); ctx.fillStyle = "#ffd87a"; ctx.fillRect(x - 4, y + 22, 8, 12);
  ctx.translate(x, y - 2); ctx.rotate(mill.spin);
  for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); ctx.fillStyle = "#6b4a2b"; ctx.fillRect(-3, 0, 6, 80); ctx.fillStyle = "#faf4e6"; ctx.fillRect(3, 10, 22, 62); ctx.strokeStyle = "#8a7a60"; ctx.lineWidth = 1.5; ctx.strokeRect(3, 10, 22, 62); ctx.beginPath(); for (let k = 0; k < 4; k++) { ctx.moveTo(3, 10 + k * 15.5); ctx.lineTo(25, 10 + k * 15.5); } ctx.stroke(); }
  ctx.fillStyle = "#333"; ctx.beginPath(); ctx.arc(0, 0, 7, 0, 7); ctx.fill(); ctx.restore();
}

// ---------- Eingabe ----------
function pos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener("pointermove", e => { mouse = pos(e); });
cv.addEventListener("pointerdown", e => { e.preventDefault(); mouse = pos(e); if (state === "play") shoot(mouse.x, mouse.y); });
addEventListener("keydown", e => { if (e.code === "KeyR") reload(); if (e.code === "Space" && state === "play") shoot(mouse.x, mouse.y); });
$("reload").addEventListener("pointerdown", e => { e.stopPropagation(); reload(); });
$("go").onclick = start; $("again").onclick = start;
document.addEventListener("contextmenu", e => { e.preventDefault(); if (state === "play") reload(); });

for (let i = 0; i < 7; i++) { spawn("hen"); chickens[i].x = rnd(0, W); }
(function legend() {
  const items = [["hen", "Huhn", "5 – 25"], ["chick", "Küken", "40"], ["rooster", "Hahn · 2 Treffer", "40"], ["gold", "Goldhuhn", "50"], ["clock", "Zeit-Huhn", "+4 Sekunden"], ["crow", "Rabe: nicht!", "-20"]];
  const box = $("legend"), real = ctx;
  for (const [sp, name, pts] of items) {
    const d = document.createElement("div"); d.className = "leg" + (sp === "crow" ? " bad" : "");
    const c = document.createElement("canvas"); c.width = 144; c.height = 120; const lc = c.getContext("2d"); lc.scale(2, 2); ctx = lc;
    drawChicken({ sp, x: 34, y: 34, s: sp === "chick" ? 1.3 : .52, dir: 1, ph: .6, dead: false, rot: 0, gold: sp === "gold", hp: 1, maxhp: 1, flash: 0 });
    ctx = real; d.appendChild(c); d.insertAdjacentHTML("beforeend", `${name}<b>${pts}</b>`); box.appendChild(d);
  }
})();
let last = performance.now(), menuT = 0;
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  if (state !== "play") { menuT -= dt; if (menuT <= 0 && chickens.length < 9) { spawn("hen"); menuT = .8; } }
  update(dt); draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
