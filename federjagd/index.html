<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d2a3a">
<title>Federjagd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --bg:#0f1622; --ink:#fff7e0; --gold:#ffcf3a; --red:#e8452e; --font:'Lilita One','Trebuchet MS',system-ui,sans-serif; }
  * { box-sizing:border-box; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden; overscroll-behavior:none; touch-action:none; font-family:var(--font); }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 50% 40%,#22324a,#0a0f18); }
  #box { position:relative; width:min(100vw, calc(100dvh * 9 / 16)); aspect-ratio:9/16; box-shadow:0 0 60px rgba(0,0,0,.6); }
  canvas { width:100%; height:100%; display:block; cursor:none; touch-action:none; }
  .ov { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; background:radial-gradient(circle at 50% 45%,rgba(8,14,26,.55),rgba(8,14,26,.88)); backdrop-filter:blur(3px); }
  .ov.off { display:none; }
  h1 { margin:0; font-weight:400; font-size:clamp(46px,15vw,92px); line-height:.95; letter-spacing:.02em; transform:rotate(-4deg);
    background:linear-gradient(#fff3a8,#ffb81c 55%,#ff7a12); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 0 #7a2c00) drop-shadow(0 8px 14px rgba(0,0,0,.6)); animation:bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform:rotate(-4deg) translateY(-6px) scale(1.03); } }
  p { margin:0; font-family:system-ui,sans-serif; font-weight:600; font-size:clamp(13px,3.6vw,18px); max-width:22em; padding:0 18px; line-height:1.4; }
  .rules { display:grid; grid-template-columns:repeat(3,auto); gap:8px 18px; font-family:var(--font); font-size:clamp(14px,4vw,20px); }
  .rules b { color:var(--gold); font-weight:400; }
  button { font:inherit; font-size:clamp(20px,6vw,32px); padding:.45em 1.6em; border:0; border-radius:999px; cursor:pointer; color:#4a2100;
    background:linear-gradient(#ffe36b,#ffb11c); box-shadow:0 6px 0 #a8620a, 0 12px 22px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.7); }
  button:active { transform:translateY(4px); box-shadow:0 2px 0 #a8620a, inset 0 2px 0 rgba(255,255,255,.7); }
  #go { animation:pulse 1.4s ease-in-out infinite; } @keyframes pulse { 50% { transform:scale(1.06); } }
  #reload { position:absolute; right:3%; bottom:4.5%; font-size:clamp(13px,3.8vw,19px); padding:.5em 1.1em; color:#fff; background:linear-gradient(#5d7699,#3a4f6e); box-shadow:0 4px 0 #1c2a40, 0 8px 14px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.3); }
  #reload:active { box-shadow:0 1px 0 #1c2a40; }
  #rot { position:fixed; inset:0; z-index:9; background:var(--bg); display:none; align-items:center; justify-content:center; flex-direction:column; gap:10px; font-size:24px; }
  @media (orientation:landscape) and (pointer:coarse) and (max-height:600px) { #rot { display:flex; } }
</style>
</head>
<body>
<div id="rot"><div style="font-size:56px">📱</div>Bitte Handy hochkant halten</div>
<div id="stage"><div id="box">
  <canvas id="c" width="540" height="960"></canvas>
  <button id="reload">Nachladen (R)</button>
  <div class="ov" id="start">
    <h1>FEDER<br>JAGD</h1>
    <p>90 Sekunden, 8 Schuss. Je kleiner und weiter weg, desto mehr Punkte.</p>
    <div class="rules"><span>Nah <b>5</b></span><span>Mitte <b>15</b></span><span>Weit <b>25</b></span><span>Windmühle <b>10</b></span><span>Golden <b>50</b></span><span>Serie <b>+Bonus</b></span></div>
    <p style="opacity:.8">Tippen = Schiessen. Leer? Nachladen-Knopf oder nochmal tippen.</p>
    <button id="go">Los geht's</button>
    <p id="hi" style="opacity:.8"></p>
  </div>
  <div class="ov off" id="end">
    <h1 id="end-h">Zeit um!</h1>
    <p id="end-t"></p>
    <button id="again">Nochmal</button>
  </div>
</div></div>

<script>
"use strict";
const W = 540, H = 960, ROUND = 90, MAG = 8, RELOAD = 0.9;
const DPR = Math.min(2, window.devicePixelRatio || 1);
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
cv.width = W * DPR; cv.height = H * DPR;
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const FONT = "'Lilita One','Trebuchet MS',system-ui,sans-serif";

// Ebenen: 0 = weit weg (klein, viele Punkte) … 2 = nah (gross, wenige Punkte)
const LAYERS = [
  { scale: 0.55, pts: 25, speed: [80, 130],  y: [110, 420] },
  { scale: 0.95, pts: 15, speed: [120, 190], y: [140, 560] },
  { scale: 1.5,  pts: 5,  speed: [180, 260], y: [170, 700] },
];
const MX = 400, MY = 565;

let best = 0;
try { best = +localStorage.getItem("federjagd.best") || 0; } catch (e) {}
$("hi").textContent = best ? `Rekord: ${best} Punkte` : "";

let state = "menu", score = 0, timeLeft = ROUND, ammo = MAG, reloadT = 0, chickens = [], feathers = [], pops = [], rings = [], sparks = [], spawnT = 0;
let mouse = { x: W / 2, y: H * .55 }, flash = 0, shake = 0, t = 0, kick = 0, hitStop = 0;
let mill = { spin: 0.6, boost: 0 }, combo = 0, hits = 0, shots = 0;

function start() {
  state = "play"; score = 0; timeLeft = ROUND; ammo = MAG; reloadT = 0; chickens = []; feathers = []; pops = []; rings = []; sparks = []; spawnT = 0; combo = 0; hits = 0; shots = 0;
  $("start").classList.add("off"); $("end").classList.add("off");
}
function finish() {
  state = "over";
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem("federjagd.best", best); } catch (e) {} }
  $("end-h").textContent = isBest ? "Neuer Rekord!" : "Zeit um!";
  const acc = shots ? Math.round(hits / shots * 100) : 0;
  $("end-t").textContent = `${score} Punkte · ${hits} Treffer · ${acc} % Trefferquote · Rekord ${best}`;
  $("end").classList.remove("off");
}

// ---------- Audio ----------
let ac;
function sfx(kind) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
    o.connect(g); g.connect(ac.destination);
    if (kind === "shot") { o.type = "sawtooth"; o.frequency.setValueAtTime(220, n); o.frequency.exponentialRampToValueAtTime(40, n + .15); g.gain.setValueAtTime(.25, n); g.gain.exponentialRampToValueAtTime(.001, n + .18); }
    else if (kind === "hit") { o.type = "square"; o.frequency.setValueAtTime(700, n); o.frequency.exponentialRampToValueAtTime(200, n + .2); g.gain.setValueAtTime(.12, n); g.gain.exponentialRampToValueAtTime(.001, n + .22); }
    else if (kind === "gold") { o.type = "triangle"; o.frequency.setValueAtTime(600, n); o.frequency.linearRampToValueAtTime(1400, n + .3); g.gain.setValueAtTime(.16, n); g.gain.exponentialRampToValueAtTime(.001, n + .4); }
    else if (kind === "click") { o.type = "square"; o.frequency.value = 120; g.gain.setValueAtTime(.1, n); g.gain.exponentialRampToValueAtTime(.001, n + .06); }
    else { o.type = "triangle"; o.frequency.setValueAtTime(300, n); o.frequency.linearRampToValueAtTime(500, n + .25); g.gain.setValueAtTime(.12, n); g.gain.exponentialRampToValueAtTime(.001, n + .3); }
    o.start(n); o.stop(n + .4);
  } catch (e) {}
}

// ---------- Hühner ----------
function spawn() {
  const gold = Math.random() < 0.05;
  const li = gold ? 0 : (Math.random() * 3) | 0, L = LAYERS[li];
  const dir = Math.random() < .5 ? 1 : -1;
  chickens.push({
    li, gold, x: dir > 0 ? -90 : W + 90, y: rnd(L.y[0], L.y[1]),
    vx: dir * rnd(L.speed[0], L.speed[1]) * (gold ? 1.6 : 1), dir, ph: Math.random() * 7, bob: rnd(.5, 1.2),
    dead: false, vy: 0, rot: 0, s: L.scale * (gold ? 1.1 : 1), pts: gold ? 50 : L.pts, flap: rnd(8, 12),
  });
}

function shoot(x, y) {
  if (ammo <= 0) { if (reloadT <= 0) reload(); return; }
  if (reloadT > 0) return;
  ammo--; shots++; flash = .1; shake = 5; kick = 1; sfx("shot");
  const order = chickens.filter(c => !c.dead).sort((a, b) => b.li - a.li || b.s - a.s);
  for (const c of order) {
    const dx = x - c.x, dy = y - (c.y + Math.sin(c.ph) * 6 * c.s);
    if (dx * dx / (36 * c.s) ** 2 + dy * dy / (28 * c.s) ** 2 < 1.2) {
      c.dead = true; c.vy = -160; c.vx *= .3; hits++; combo++;
      const bonus = combo >= 3 ? Math.min(combo - 2, 5) : 0;
      const p = c.pts + bonus; score += p;
      pops.push({ x: c.x, y: c.y - 34 * c.s, txt: "+" + p, life: 1, col: c.gold ? "#ffe066" : "#fff", big: c.gold || combo >= 3 });
      rings.push({ x: c.x, y: c.y, r: 6, life: .35, col: c.gold ? "255,220,80" : "255,255,255" });
      const n = c.gold ? 26 : 16;
      for (let i = 0; i < n; i++) feathers.push({ x: c.x, y: c.y, vx: rnd(-220, 220), vy: rnd(-260, 60), r: rnd(0, 6), life: rnd(.8, 1.6), col: c.gold ? (Math.random() < .5 ? "#ffd84a" : "#fff3b0") : ["#c4733a", "#f2e3c0", "#6b3f23"][(Math.random() * 3) | 0], sz: rnd(.8, 1.4) * c.s + .3 });
      hitStop = .06; shake = 9;
      sfx(c.gold ? "gold" : "hit"); return;
    }
  }
  if (Math.hypot(x - MX, y - (MY + 40)) < 80) { mill.boost = 1.6; score += 10; pops.push({ x, y: y - 20, txt: "+10", life: 1, col: "#fff" }); rings.push({ x, y, r: 6, life: .3, col: "255,255,255" }); sfx("hit"); return; }
  combo = 0;
}
function reload() { if (reloadT > 0 || ammo === MAG) return; reloadT = RELOAD; sfx("click"); }

// ---------- Update ----------
function update(dt) {
  if (hitStop > 0) { hitStop -= dt; dt *= .12; }
  t += dt;
  mill.boost = Math.max(0, mill.boost - dt);
  mill.spin += dt * (0.5 + mill.boost * 6);
  flash = Math.max(0, flash - dt); shake = Math.max(0, shake - 24 * dt); kick = Math.max(0, kick - dt * 5);
  for (const f of feathers) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 170 * dt; f.vx *= .985; f.vy *= .99; f.r += dt * 7; f.life -= dt; }
  feathers = feathers.filter(f => f.life > 0);
  for (const p of pops) { p.y -= 46 * dt; p.life -= dt; }
  pops = pops.filter(p => p.life > 0);
  for (const r of rings) { r.r += 260 * dt; r.life -= dt; }
  rings = rings.filter(r => r.life > 0);
  for (const sp of sparks) { sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.life -= dt; }
  sparks = sparks.filter(sp => sp.life > 0);
  for (const c of chickens) {
    if (c.gold && !c.dead && Math.random() < dt * 30) sparks.push({ x: c.x + rnd(-30, 30) * c.s, y: c.y + rnd(-20, 20) * c.s, vx: rnd(-20, 20), vy: rnd(10, 50), life: rnd(.4, .8) });
  }
  if (state !== "play") { for (const c of chickens) stepChicken(c, dt); chickens = chickens.filter(c => c.x > -160 && c.x < W + 160 && c.y < H + 100); return; }

  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; finish(); return; }
  if (reloadT > 0) { reloadT -= dt; if (reloadT <= 0) { ammo = MAG; sfx("ready"); } }
  spawnT -= dt;
  if (spawnT <= 0 && chickens.length < 14) { spawn(); spawnT = rnd(.35, 1.0); }
  for (const c of chickens) stepChicken(c, dt);
  chickens = chickens.filter(c => c.x > -160 && c.x < W + 160 && c.y < H + 100);
}
function stepChicken(c, dt) {
  if (c.dead) { c.vy += 950 * dt; c.y += c.vy * dt; c.x += c.vx * dt; c.rot += dt * 9 * c.dir; }
  else { c.x += c.vx * dt; c.ph += dt * c.flap * c.bob; }
}

// ---------- Vorgerenderte Hintergrund-Ebenen ----------
function layer(fn) { const c = document.createElement("canvas"); c.width = W * DPR; c.height = H * DPR; const x = c.getContext("2d"); x.scale(DPR, DPR); fn(x); return c; }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let z = Math.imul(seed ^ seed >>> 15, 1 | seed); z = z + Math.imul(z ^ z >>> 7, 61 | z) ^ z; return ((z ^ z >>> 14) >>> 0) / 4294967296; }; }
function lin(x, y0, y1, stops) { const g = x.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }

function ridgePath(x, f, base) { x.beginPath(); x.moveTo(0, base); for (let i = 0; i <= W; i += 6) x.lineTo(i, f(i)); x.lineTo(W, base); x.closePath(); }
function pine(x, px, py, s, c1, c2) {
  x.fillStyle = "#3b2512"; x.fillRect(px - 3 * s, py - 6 * s, 6 * s, 14 * s);
  for (let i = 0; i < 3; i++) {
    const w = (34 - i * 7) * s, y0 = py - (i * 26 - 4) * s, g = x.createLinearGradient(px - w, 0, px + w, 0);
    g.addColorStop(0, c2); g.addColorStop(.5, c1); g.addColorStop(1, c2); x.fillStyle = g;
    x.beginPath(); x.moveTo(px - w, y0); x.lineTo(px, y0 - 46 * s); x.lineTo(px + w, y0); x.closePath(); x.fill();
  }
}

const BG = {};
function buildBackground() {
  // 1) Himmel, Sonne, Berge
  BG.sky = layer(x => {
    x.fillStyle = lin(x, 0, 720, [[0, "#2467c9"], [.4, "#5aaef0"], [.78, "#ffd9a6"], [1, "#ffeccd"]]); x.fillRect(0, 0, W, H);
    let g = x.createRadialGradient(410, 400, 10, 410, 400, 300); g.addColorStop(0, "rgba(255,246,200,.95)"); g.addColorStop(.25, "rgba(255,226,160,.45)"); g.addColorStop(1, "rgba(255,226,160,0)");
    x.fillStyle = g; x.fillRect(0, 100, W, 600);
    x.fillStyle = "#fffbe8"; x.beginPath(); x.arc(410, 400, 34, 0, 7); x.fill();
    const mtn = (f, base, topCol, botCol, snowY, haze) => {
      ridgePath(x, f, base); x.fillStyle = lin(x, 300, base, [[0, topCol], [1, botCol]]); x.fill();
      // Schnee
      x.beginPath(); let started = false; const pts = [];
      for (let i = 0; i <= W; i += 3) { const r = f(i), d = Math.max(0, snowY - r) * .55; if (d > 0) pts.push([i, r, r + d + 7 * Math.abs(Math.sin(i * .35))]); }
      x.fillStyle = "rgba(255,255,255,.93)";
      let seg = [];
      const flush = () => { if (seg.length > 1) { x.beginPath(); seg.forEach(([i, r]) => x.lineTo(i, r)); for (let k = seg.length - 1; k >= 0; k--) x.lineTo(seg[k][0], seg[k][2]); x.closePath(); x.fill(); } seg = []; };
      let prev = -9; for (const p of pts) { if (p[0] - prev > 4) flush(); seg.push(p); prev = p[0]; } flush();
      // Schattenseite
      x.fillStyle = "rgba(40,70,120,.18)"; x.beginPath(); x.moveTo(0, base);
      for (let i = 0; i <= W; i += 6) x.lineTo(i, f(i) + 10 + 18 * Math.abs(Math.sin(i * .05))); x.lineTo(W, base); x.fill();
      if (haze) { x.fillStyle = lin(x, base - 180, base, [[0, "rgba(255,236,205,0)"], [1, "rgba(255,236,205," + haze + ")"]]); x.fillRect(0, base - 180, W, 180); }
    };
    mtn(i => 500 - 95 * Math.abs(Math.sin(i * .0075 + .2)) - 26 * Math.sin(i * .021 + 1), 700, "#a9bfdc", "#c9d6e8", 470, .55);
    mtn(i => 560 - 80 * Math.abs(Math.sin(i * .009 + 1.4)) - 22 * Math.sin(i * .026), 720, "#6f8fbb", "#9db5d3", 500, .5);
  });
  // 2) Hügel mit Wald
  BG.hills = layer(x => {
    const f = i => 650 - 36 * Math.sin(i * .011 + 2) - 14 * Math.sin(i * .03);
    ridgePath(x, f, H); x.fillStyle = lin(x, 600, 800, [[0, "#78b855"], [1, "#3f8a3f"]]); x.fill();
    const R = rng(7);
    for (let i = -10; i < W + 10; i += 11 + R() * 8) { const s = .38 + R() * .22; pine(x, i, f(i) + 6, s, "#2f7a42", "#1d5530"); }
    x.fillStyle = "rgba(255,240,200,.18)"; ridgePath(x, f, H); x.fill();
    // kleine Weide mit Bauernhaus
    x.fillStyle = "#e9d7b4"; x.fillRect(70, f(100) - 18, 40, 24); x.fillStyle = "#a83c2a"; x.beginPath(); x.moveTo(64, f(100) - 18); x.lineTo(90, f(100) - 40); x.lineTo(116, f(100) - 18); x.fill();
    x.fillStyle = "#6b4a2b"; x.fillRect(84, f(100) - 6, 11, 12);
  });
  // 3) Wiese, Bäume, Blumen
  BG.meadow = layer(x => {
    const f = i => 790 - 24 * Math.sin(i * .014 + .5) - 8 * Math.sin(i * .05);
    ridgePath(x, f, H); x.fillStyle = lin(x, 740, 960, [[0, "#6dbb45"], [.5, "#3f9a35"], [1, "#256d2c"]]); x.fill();
    x.strokeStyle = "rgba(255,255,255,.18)"; x.lineWidth = 3; x.beginPath(); for (let i = 0; i <= W; i += 6) x[i ? "lineTo" : "moveTo"](i, f(i) + 2); x.stroke();
    const R = rng(21);
    for (let k = 0; k < 90; k++) { const px = R() * W, py = f(px) + 20 + R() * 130, c = ["#ffffff", "#ffe14d", "#ff7ab8", "#ff5a4a"][(R() * 4) | 0]; x.fillStyle = c; x.beginPath(); x.arc(px, py, 2 + R() * 2, 0, 7); x.fill(); x.fillStyle = "#e08a00"; x.beginPath(); x.arc(px, py, 1, 0, 7); x.fill(); }
    for (const [px, s] of [[38, 1.5], [110, 1.15], [468, 1.2], [524, 1.7]]) pine(x, px, f(px) + 20, s, "#2c8140", "#14482a");
    // Büsche
    for (const [px, py] of [[210, 830], [300, 845], [160, 852]]) { x.fillStyle = "#2e8a3a"; for (let i = 0; i < 4; i++) { x.beginPath(); x.arc(px + i * 14 - 20, py - (i % 2) * 8, 18, 0, 7); x.fill(); } x.fillStyle = "rgba(255,255,255,.12)"; x.beginPath(); x.arc(px - 10, py - 14, 10, 0, 7); x.fill(); }
  });
  // 4) Zaun vorne
  BG.fence = layer(x => {
    x.fillStyle = lin(x, 905, 960, [[0, "#2b7a2d"], [1, "#12411a"]]); x.fillRect(0, 905, W, 60);
    const wood = (px, py, w, h) => { const g = x.createLinearGradient(px, 0, px + w, 0); g.addColorStop(0, "#a8774a"); g.addColorStop(.5, "#8a5a31"); g.addColorStop(1, "#5d3a1c"); x.fillStyle = g; x.fillRect(px, py, w, h); x.strokeStyle = "rgba(0,0,0,.25)"; x.lineWidth = 1; x.strokeRect(px, py, w, h); };
    for (let px = 8; px < W; px += 86) { wood(px, 868, 16, 96); x.fillStyle = "#c18d5b"; x.beginPath(); x.moveTo(px, 868); x.lineTo(px + 8, 858); x.lineTo(px + 16, 868); x.fill(); }
    wood(0, 884, W, 12); wood(0, 920, W, 12);
    x.fillStyle = "rgba(0,0,0,.25)"; x.fillRect(0, 896, W, 4); x.fillRect(0, 932, W, 4);
  });
  // 5) Vignette
  BG.vig = layer(x => { const g = x.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(5,10,30,.5)"); x.fillStyle = g; x.fillRect(0, 0, W, H); });
}
buildBackground();

// ---------- Zeichnen ----------
function cloud(x, y, s) {
  const blobs = [[0, 0, 40], [38, -10, 30], [-38, -4, 28], [66, 4, 22], [-62, 6, 20]];
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = "rgba(190,205,235,.85)"; blobs.forEach(([a, b, r]) => { ctx.beginPath(); ctx.arc(a, b + 9, r, 0, 7); ctx.fill(); });
  ctx.fillStyle = "rgba(255,255,255,.96)"; blobs.forEach(([a, b, r]) => { ctx.beginPath(); ctx.arc(a, b, r, 0, 7); ctx.fill(); });
  ctx.restore();
}

function drawChicken(c) {
  const s = c.s, fl = c.dead ? .6 : Math.sin(c.ph);
  ctx.save(); ctx.translate(c.x, c.y + (c.dead ? 0 : Math.sin(c.ph) * 6 * s)); ctx.scale(s * c.dir, s); ctx.rotate(c.rot * c.dir);
  if (c.gold) { ctx.shadowColor = "rgba(255,220,80,.95)"; ctx.shadowBlur = 26; }
  const base = c.gold ? ["#fff0a0", "#f6c91c", "#b98900"] : ["#b9763f", "#6b3f23", "#3a1f0e"];
  const wingC = c.gold ? ["#ffe066", "#d9a300"] : ["#7a4a28", "#3a1f0e"];
  ctx.lineWidth = 3; ctx.lineJoin = "round"; ctx.strokeStyle = "rgba(25,12,4,.75)";
  // Schwanzfedern
  [[-.75, c.gold ? "#d9a300" : "#2f6b5a"], [-.4, c.gold ? "#f0b800" : "#8c4a22"], [-.05, c.gold ? "#ffd84a" : "#43260f"]].forEach(([a, col]) => {
    ctx.save(); ctx.translate(-26, -2); ctx.rotate(a + Math.PI); ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(-22, 0, 24, 7.5, 0, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore();
  });
  // Beine
  ctx.strokeStyle = "#e58a1c"; ctx.lineWidth = 4; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-2, 22); ctx.lineTo(-16, 36); ctx.moveTo(8, 22); ctx.lineTo(-6, 38); ctx.stroke();
  ctx.lineCap = "butt"; ctx.strokeStyle = "rgba(25,12,4,.75)"; ctx.lineWidth = 3;
  // hinterer Flügel
  ctx.fillStyle = wingC[1]; ctx.beginPath(); ctx.ellipse(-6, -12 - fl * 22, 25, 12, -0.6 - fl * .5, 0, 7); ctx.fill(); ctx.stroke();
  // Körper
  let g = ctx.createRadialGradient(8, -8, 4, 0, 6, 38); g.addColorStop(0, base[0]); g.addColorStop(.55, base[1]); g.addColorStop(1, base[2]);
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 4, 33, 22, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = c.gold ? "#fff6c0" : "#d9a066"; ctx.beginPath(); ctx.ellipse(8, 13, 20, 10, .1, 0, 7); ctx.fill();
  // Halskragen
  ctx.fillStyle = c.gold ? "#ffe680" : "#e0952f"; ctx.beginPath(); ctx.ellipse(22, -6, 11, 13, .3, 0, 7); ctx.fill();
  // Kopf
  g = ctx.createRadialGradient(34, -20, 2, 31, -15, 16); g.addColorStop(0, c.gold ? "#fff6c0" : "#d9863a"); g.addColorStop(1, c.gold ? "#e8b400" : "#7a4420");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(31, -15, 13.5, 0, 7); ctx.fill(); ctx.stroke();
  // Kamm
  ctx.fillStyle = "#e8302a"; [[26, -28, 5.5], [33, -30, 6.5], [39, -26, 5]].forEach(([a, b, r]) => { ctx.beginPath(); ctx.arc(a, b, r, 0, 7); ctx.fill(); ctx.stroke(); });
  ctx.fillStyle = "rgba(255,255,255,.4)"; ctx.beginPath(); ctx.arc(31, -32, 2.2, 0, 7); ctx.fill();
  // Schnabel
  ctx.fillStyle = "#ffb12b"; ctx.beginPath(); ctx.moveTo(42, -19); ctx.lineTo(57, -13); ctx.lineTo(42, -12); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#e8962a"; ctx.beginPath(); ctx.moveTo(42, -12); ctx.lineTo(54, -11); ctx.lineTo(42, -7); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#e8302a"; ctx.beginPath(); ctx.ellipse(43, -3, 3.2, 6, 0, 0, 7); ctx.fill();
  // Auge
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(35, -18, 5.6, 0, 7); ctx.fill(); ctx.lineWidth = 2; ctx.stroke();
  if (c.dead) { ctx.strokeStyle = "#c00"; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(32.5, -20.5); ctx.lineTo(37.5, -15.5); ctx.moveTo(37.5, -20.5); ctx.lineTo(32.5, -15.5); ctx.stroke(); }
  else { ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(37, -18, 2.6, 0, 7); ctx.fill(); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(37.8, -19, 1, 0, 7); ctx.fill();
    ctx.strokeStyle = "#2a1408"; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(30, -26); ctx.lineTo(40, -22); ctx.stroke(); }
  // vorderer Flügel
  if (c.gold) { ctx.shadowColor = "rgba(255,220,80,.9)"; ctx.shadowBlur = 14; }
  g = ctx.createLinearGradient(-20, 0, 20, 0); g.addColorStop(0, wingC[1]); g.addColorStop(1, wingC[0]);
  ctx.fillStyle = g; ctx.strokeStyle = "rgba(25,12,4,.75)"; ctx.lineWidth = 3;
  ctx.save(); ctx.translate(-2, 0 - fl * 4); ctx.rotate(-0.3 + fl * .75);
  ctx.beginPath(); ctx.ellipse(0, -14, 14, 30, 0, 0, 7); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
  ctx.strokeStyle = "rgba(0,0,0,.28)"; ctx.lineWidth = 2; ctx.beginPath(); for (let i = -1; i <= 1; i++) { ctx.moveTo(i * 5, -4); ctx.lineTo(i * 8, -38); } ctx.stroke();
  ctx.restore();
  ctx.restore();
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  if (shake) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  ctx.drawImage(BG.sky, 0, 0, W, H);
  for (let i = 0; i < 4; i++) cloud(((i * 230 + t * (7 + i * 3)) % (W + 300)) - 150, 120 + i * 78 + (i % 2) * 20, .8 + i * .12);
  chickens.forEach(c => c.li === 0 && drawChicken(c));
  ctx.drawImage(BG.hills, 0, 0, W, H);
  drawMill();
  chickens.forEach(c => c.li === 1 && drawChicken(c));
  ctx.drawImage(BG.meadow, 0, 0, W, H);
  chickens.forEach(c => c.li === 2 && drawChicken(c));
  ctx.drawImage(BG.fence, 0, 0, W, H);
  // schwingendes Gras vorne
  ctx.fillStyle = "#2f8f36";
  for (let x = -6; x < W + 10; x += 14) { const h = 20 + (x * 7 % 13), sw = Math.sin(t * 2 + x * .1) * 5; ctx.beginPath(); ctx.moveTo(x, 966); ctx.quadraticCurveTo(x + 2 + sw * .5, 966 - h * .6, x + 4 + sw, 966 - h); ctx.lineTo(x + 8, 966); ctx.fill(); }
  // Funken
  for (const sp of sparks) { ctx.globalAlpha = Math.max(0, sp.life * 1.6); ctx.fillStyle = "#fff3a8"; ctx.beginPath(); ctx.arc(sp.x, sp.y, 2.4, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const f of feathers) { ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.r); ctx.globalAlpha = Math.min(1, f.life * 1.4); ctx.scale(f.sz, f.sz); ctx.fillStyle = f.col; ctx.beginPath(); ctx.ellipse(0, 0, 9, 3.4, 0, 0, 7); ctx.fill(); ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = 1; ctx.stroke(); ctx.restore(); }
  ctx.globalAlpha = 1;
  for (const r of rings) { ctx.strokeStyle = `rgba(${r.col},${Math.max(0, r.life * 2.6)})`; ctx.lineWidth = 5 * r.life * 3; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.stroke(); }
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const p of pops) {
    const sc = 1 + Math.max(0, p.life - .75) * 3.2 + (p.big ? .35 : 0);
    ctx.save(); ctx.translate(p.x, p.y); ctx.scale(sc, sc); ctx.globalAlpha = Math.min(1, p.life * 1.8);
    ctx.font = `30px ${FONT}`; ctx.lineWidth = 7; ctx.lineJoin = "round"; ctx.strokeStyle = "#2a1200"; ctx.strokeText(p.txt, 0, 0); ctx.fillStyle = p.col; ctx.fillText(p.txt, 0, 0); ctx.restore();
  }
  ctx.globalAlpha = 1;
  if (flash > 0) { ctx.fillStyle = `rgba(255,240,190,${flash * 2.2})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
  ctx.drawImage(BG.vig, 0, 0, W, H);
  hud();
  if (state === "play") crosshair();
}

function plate(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function txt(s, x, y, size, al, col = "#fff7e0", stroke = "#2a1200") {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = al; ctx.textBaseline = "middle"; ctx.lineJoin = "round"; ctx.lineWidth = size * .22; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function hud() {
  // Punkte
  plate(12, 12, 170, 62, 18); ctx.fillStyle = "rgba(14,22,40,.62)"; ctx.fill(); ctx.strokeStyle = "#ffcf3a"; ctx.lineWidth = 3; ctx.stroke();
  txt("PUNKTE", 28, 29, 14, "left", "#ffcf3a", "rgba(0,0,0,0)"); txt(String(score).padStart(4, "0"), 28, 54, 36, "left");
  // Zeit-Ring
  const cx = W - 48, cy = 46, tl = Math.ceil(timeLeft), frac = timeLeft / ROUND, low = tl <= 10;
  ctx.fillStyle = "rgba(14,22,40,.62)"; ctx.beginPath(); ctx.arc(cx, cy, 36, 0, 7); ctx.fill();
  ctx.lineWidth = 7; ctx.strokeStyle = "rgba(255,255,255,.15)"; ctx.beginPath(); ctx.arc(cx, cy, 31, 0, 7); ctx.stroke();
  ctx.strokeStyle = low ? "#ff5a3d" : "#6fe07a"; ctx.lineCap = "round"; ctx.beginPath(); ctx.arc(cx, cy, 31, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); ctx.stroke(); ctx.lineCap = "butt";
  txt(String(tl), cx, cy + 1, low ? 34 + Math.sin(t * 12) * 2 : 32, "center", low ? "#ff8a6a" : "#fff7e0");
  if (state === "play" && combo >= 3) { const sc = 1 + Math.sin(t * 10) * .04; ctx.save(); ctx.translate(W / 2, 100); ctx.scale(sc, sc); plate(-70, -18, 140, 36, 18); ctx.fillStyle = "#e8452e"; ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5; ctx.stroke(); txt(`SERIE x${combo}`, 0, 1, 22, "center"); ctx.restore(); }
  // Munition
  plate(12, H - 96, 8 * 20 + 24, 50, 14); ctx.fillStyle = "rgba(14,22,40,.62)"; ctx.fill();
  for (let i = 0; i < MAG; i++) {
    const full = i < ammo, bx = 26 + i * 20, by = H - 88;
    ctx.fillStyle = full ? "#e8a428" : "rgba(255,255,255,.15)"; ctx.fillRect(bx, by + 14, 11, 24);
    ctx.fillStyle = full ? "#ffdb70" : "rgba(255,255,255,.15)"; ctx.fillRect(bx + 1.5, by + 14, 3, 24);
    ctx.fillStyle = full ? "#c9662a" : "rgba(255,255,255,.15)"; ctx.beginPath(); ctx.moveTo(bx, by + 14); ctx.lineTo(bx + 5.5, by + 1); ctx.lineTo(bx + 11, by + 14); ctx.fill();
  }
  if (reloadT > 0) { plate(12, H - 112, 184, 10, 5); ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fill(); plate(12, H - 112, Math.max(10, 184 * (1 - reloadT / RELOAD)), 10, 5); ctx.fillStyle = "#6fe07a"; ctx.fill(); }
  else if (ammo === 0 && state === "play") txt("NACHLADEN!", W / 2, H - 150, 34 + Math.sin(t * 10) * 2, "center", "#ffcf3a");
}
function crosshair() {
  const { x, y } = mouse, r = 20 + kick * 8; ctx.save(); ctx.translate(x, y); ctx.lineCap = "round";
  for (const [col, w] of [["rgba(0,0,0,.55)", 7], ["#ff3b2f", 3.5]]) {
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7);
    [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([a, b]) => { ctx.moveTo(a * (r - 6), b * (r - 6)); ctx.lineTo(a * (r + 12), b * (r + 12)); }); ctx.stroke();
  }
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, 3, 0, 7); ctx.fill(); ctx.restore();
}
function drawMill() {
  const x = MX, y = MY;
  ctx.save();
  let g = ctx.createLinearGradient(x - 28, 0, x + 28, 0); g.addColorStop(0, "#f4e8cf"); g.addColorStop(1, "#b9a77f");
  ctx.fillStyle = g; ctx.strokeStyle = "rgba(40,25,10,.6)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x - 28, y + 92); ctx.lineTo(x - 17, y); ctx.lineTo(x + 17, y); ctx.lineTo(x + 28, y + 92); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#b8402c"; ctx.beginPath(); ctx.moveTo(x - 24, y + 2); ctx.lineTo(x, y - 26); ctx.lineTo(x + 24, y + 2); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#6b4a2b"; ctx.fillRect(x - 7, y + 62, 14, 30); ctx.fillStyle = "#ffd87a"; ctx.fillRect(x - 4, y + 22, 8, 12);
  ctx.translate(x, y - 2); ctx.rotate(mill.spin);
  for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); ctx.fillStyle = "#6b4a2b"; ctx.fillRect(-3, 0, 6, 80); ctx.fillStyle = "#faf4e6"; ctx.fillRect(3, 10, 22, 62); ctx.strokeStyle = "#8a7a60"; ctx.lineWidth = 1.5; ctx.strokeRect(3, 10, 22, 62); ctx.beginPath(); for (let k = 0; k < 4; k++) { ctx.moveTo(3, 10 + k * 15.5); ctx.lineTo(25, 10 + k * 15.5); } ctx.stroke(); }
  ctx.fillStyle = "#333"; ctx.beginPath(); ctx.arc(0, 0, 7, 0, 7); ctx.fill(); ctx.restore();
}

// ---------- Eingabe ----------
function pos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener("pointermove", e => { mouse = pos(e); });
cv.addEventListener("pointerdown", e => { e.preventDefault(); mouse = pos(e); if (state === "play") shoot(mouse.x, mouse.y); });
addEventListener("keydown", e => { if (e.code === "KeyR") reload(); if (e.code === "Space" && state === "play") shoot(mouse.x, mouse.y); });
$("reload").addEventListener("pointerdown", e => { e.stopPropagation(); reload(); });
$("go").onclick = start; $("again").onclick = start;
document.addEventListener("contextmenu", e => { e.preventDefault(); if (state === "play") reload(); });

for (let i = 0; i < 7; i++) { spawn(); chickens[i].x = rnd(0, W); }
let last = performance.now(), menuT = 0;
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  if (state !== "play") { menuT -= dt; if (menuT <= 0 && chickens.length < 9) { spawn(); menuT = .8; } }
  update(dt); draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
